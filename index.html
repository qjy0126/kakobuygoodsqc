<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="application-name" content="KakobuyQC" />
  <meta name="apple-mobile-web-app-title" content="KakobuyQC" />

  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="KakobuyQC — QC Photos, Videos &amp; Product Finder" />
  <meta property="og:description" content="Browse product finds, reference photos, and Kakobuy links." />
  <meta property="og:type" content="website" />
  <link rel="privacy-policy" href="privacy.html" />
  <link rel="disclaimer" href="disclaimer.html" />
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.kakobuygoodsqc.com/#organization",
        "name": "KakobuyQC",
        "url": "https://www.kakobuygoodsqc.com/",
        "logo": "https://www.kakobuygoodsqc.com/img/logo.png",
        "description": "Independent product discovery and QC reference site."
      },
      {
        "@type": "WebSite",
        "@id": "https://www.kakobuygoodsqc.com/#website",
        "url": "https://www.kakobuygoodsqc.com/",
        "name": "KakobuyQC",
        "publisher": { "@id": "https://www.kakobuygoodsqc.com/#organization" },
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.kakobuygoodsqc.com/shop.html?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-brand">
          <p class="hero-brand-title">KakobuyQC</p>
          <p class="hero-brand-tag">kakobuy spreadsheet</p>
        </div>
        <p class="hero-sub">QC Photos, Videos &amp; Spreadsheet Finder for Oopbuy &amp; Kakobuy</p>
        <form class="search-shell" id="hero-search">
          <input id="hero-q" type="search" placeholder="Product Link or Keyword" autocomplete="off" />
          <button class="search-btn" type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span>Search</span>
          </button>
        </form>
        <nav class="cat-icons" id="cat-row" aria-label="Categories"></nav>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <div>
            <h2>Top Picks · Fair Pricing</h2>
            <p>Only the ones we’d buy ourselves</p>
          </div>
          <a class="view-all" href="shop.html?sort=picks">VIEW ALL <span class="arrow">→</span></a>
        </div>
        <div class="rail" data-rail="picks">
          <button class="rail-btn rail-prev" type="button" aria-label="Previous">‹</button>
          <div class="rail-track" id="top-picks"></div>
          <button class="rail-btn rail-next" type="button" aria-label="Next">›</button>
        </div>
      </div>
    </section>

    <div id="home-rails"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/catalog.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
