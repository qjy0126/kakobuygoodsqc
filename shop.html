<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse — KakoQC</title>
  <meta name="description" content="Browse KakoQC finds — QC photos, videos, and spreadsheet finder for Oopbuy, Kakobuy, and more. Filter by category, search, or wishlist." />
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="section page-top">
      <div class="wrap">
        <div class="section-head">
          <div>
            <h2 id="shop-title">Browse finds</h2>
            <p id="shop-sub">Loading…</p>
          </div>
        </div>
        <div class="shop-chips" id="shop-chips"></div>
        <div class="toolbar">
          <input id="shop-q" type="search" placeholder="Search…" />
          <select id="shop-cat" aria-label="Category"></select>
          <select id="shop-sort" aria-label="Sort">
            <option value="popular">Popular</option>
            <option value="picks">Top picks</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
          </select>
          <button class="btn btn-solid" type="button" id="shop-go">Apply</button>
        </div>
        <div class="product-grid" id="shop-grid"></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/catalog.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
